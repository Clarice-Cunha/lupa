name: Ping Supabase (anti-pausa)

# Roda automaticamente TODOS OS DIAS as 09:37 UTC (06:37 de Natal/RN)
# e tambem pode ser disparado manualmente pela aba "Actions" do GitHub.
#
# Por que diario e nao semanal? O Supabase pausa o projeto apos 7 dias sem
# atividade. O GitHub nao garante a hora exata dos agendamentos (pode atrasar
# ou pular execucoes em horarios de pico). Um ping diario garante margem: mesmo
# que varios dias falhem, nunca chegamos perto do limite de 7 dias.
# O minuto 37 (em vez de 00) evita o horario de pico do GitHub, reduzindo atrasos.
on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gravar batimento (heartbeat) no banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "ERRO: Secrets SUPABASE_URL ou SUPABASE_KEY nao configurados."
            exit 1
          fi
          # ESCREVEMOS (em vez de apenas ler), porque o Supabase nao conta
          # leituras leves como atividade suficiente para evitar a pausa.
          # Atualizamos sempre a MESMA linha (id=1) da tabela 'ping_heartbeat',
          # entao ela nunca cresce. O cabecalho "Prefer: resolution=merge-duplicates"
          # diz ao Supabase para inserir a linha se ela nao existir ou atualizar
          # se ja existir (upsert).
          AGORA=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Gravando heartbeat em ping_heartbeat (last_ping = $AGORA)..."
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\":1,\"last_ping\":\"$AGORA\"}" \
            "${SUPABASE_URL%/}/rest/v1/ping_heartbeat")
          echo "HTTP status: $STATUS"
          # Aceita qualquer codigo de sucesso (2xx). Upsert costuma retornar 201.
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Falha na gravacao. Resposta do Supabase:"
            cat /tmp/resp.json
            echo ""
            echo "DICA: confira se a tabela 'ping_heartbeat' foi criada no Supabase."
            exit 1
          fi
          echo "OK - heartbeat gravado. Atividade de ESCRITA registrada no Supabase."
